name: supplier
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.10+11

environment:
  sdk: ^3.5.2

dependencies:
  carousel_slider: ^5.0.0
  cloud_firestore: ^5.5.0
  cupertino_icons: ^1.0.8
  device_preview: ^1.2.0
  firebase_auth: ^5.3.3
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.6
  firebase_remote_config: ^5.2.0
  firebase_storage: ^12.3.6
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  flutter_dotenv: ^5.2.1
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: ^2.4.3
  flutter_pdfview: ^1.3.4
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.0.12
  fluttertoast: ^8.2.10
  get_it: ^8.0.2
  google_sign_in: ^6.2.2
  image_picker: ^1.1.2
  lottie: ^3.1.3
  package_info_plus: ^8.1.2
  phone_form_field: ^10.0.4
  shared_preferences: ^2.5.2
  shimmer: ^3.0.0
  sign_in_with_apple: ^6.1.4
  smooth_page_indicator: ^1.2.0+3
  supabase_flutter: ^2.8.1
  url_launcher: ^6.3.1
dev_dependencies:
  flutter_launcher_icons: ^0.14.2
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/app_icon.jpeg"
  min_sdk_android: 23 # android min sdk min:16, default 21
  adaptive_icon_background: "#dadada" # You can use a color or image for the background
  adaptive_icon_foreground: "assets/images/app_icon.jpeg" # For adaptive icons on Android

flutter:

  uses-material-design: true
  # To add assets to your application, add an assets section, like this:
  generate: true

  assets:
    - assets/svgs/
    - assets/images/
    - assets/images/Digital/
    - assets/images/Gift Items/
    - assets/images/Packaging/
    - assets/images/printing/
    - assets/images/Signage/
    - assets/images/Unifoarm/
    - assets/jsons/Supplier Logo Final333-01.json 
    - assets/jsons/Main Scene.json
    - assets/images/Molded Fiber Products/
    - assets/images/Carton Products/
    - assets/images/Foam Products/
    - assets/images/Tissue Products/
    - assets/images/Hygiene and protection/
    - assets/images/Alumium Products/Containers/
    - assets/images/Alumium Products/Foils/
    #assets/images/Plastic Products/Plate_Trays/1.jpeg
    - assets/images/Alumium Products/Platters/
    - assets/images/Alumium Products/Pots/
    - assets/images/Plastic Products/Bakery Range/
    - assets/images/Plastic Products/Bottles/
    - assets/images/Plastic Products/Cling Film/
    - assets/images/Plastic Products/Containers/
    - assets/images/Plastic Products/Cups/
    - assets/images/Plastic Products/Cutlery range/
    - assets/images/Plastic Products/Deli Containers/
    - assets/images/Plastic Products/Garbage Bags/
    - assets/images/Plastic Products/Microwave Containers/
    - assets/images/Plastic Products/PlateTrays/ 
    - assets/images/Plastic Products/Portion Cups/
    - assets/images/Plastic Products/Powls/
    - assets/images/Plastic Products/Salad Containers/
    - assets/images/Plastic Products/StirrerStraws/
    - assets/images/Plastic Products/Table Sheets/
    - assets/images/Plastic Products/Tamper Evident Containers/
    - assets/images/Wooden Products/Concession Trays/
    - assets/images/Wooden Products/Cutleries/
    - assets/images/Wooden Products/Sticks & Skewers/
    - assets/images/paper products/Baking Range/
    - assets/images/paper products/Bowls/
    - assets/images/paper products/Boxes/
    - assets/images/paper products/Concession Supplies/
    - assets/images/paper products/Cups/
    - assets/images/paper products/Paper Bags/
    - assets/images/paper products/Sweet Boxes/
    - assets/images/Hygiene and protection/Dispenser/
    - assets/images/Hygiene and protection/Cleaner/
    - assets/images/Hygiene and protection/Gloves/
    - assets/images/Hygiene and protection/Hygiene/ 
    - supa_keys.env
  fonts:
    - family: Quicksand
      fonts:
        - asset: assets/fonts/quick_sand/Quicksand-Regular.ttf
          weight: 400
        - asset: assets/fonts/quick_sand/Quicksand-Medium.ttf
          weight: 500
        - asset: assets/fonts/quick_sand/Quicksand-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/quick_sand/Quicksand-Bold.ttf
          weight: 700

    - family: Cairo
      fonts:
        - asset: assets/fonts/cairo/Cairo-Regular.ttf
        - asset: assets/fonts/cairo/Cairo-Medium.ttf
        - asset: assets/fonts/cairo/Cairo-SemiBold.ttf
        - asset: assets/fonts/cairo/Cairo-Bold.ttf
flutter_intl:
  enabled: true
